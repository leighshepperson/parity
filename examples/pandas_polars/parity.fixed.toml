# Passing counterparts to the public fault corpus.
version = 2
artifact_dir = "../../.parity/fixed-corpus"
fail_fast = false

[[cases]]
name = "null-join-fixed"
[[cases.invocation.args]]
kind = "frame"
fixture = "fixtures/null_join.parquet"
[cases.reference]
target = "faults:join_reference"
adapter = "pandas"
[cases.candidate]
target = "corrected:join_fixed"
adapter = "polars"
[cases.invocation.args.schema]
min_rows = 1
max_rows = 6
[[cases.invocation.args.schema.columns]]
name = "customer_id"
dtype = "int64"
nullable = true
minimum = 0
maximum = 20
examples = [1, 2]
[cases.comparison]
row_order = "ignore"
dtype = "compatible"
[cases.generation]
max_examples = 3
seed = 201
[cases.performance]
enabled = false

