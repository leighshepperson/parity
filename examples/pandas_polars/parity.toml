# Expected-failure campaign: six deliberately incorrect migrations.
version = 2
artifact_dir = "../../.parity/fault-corpus"
fail_fast = false

[[cases]]
name = "null-join"
tags = ["join", "null"]
[cases.reference]
target = "faults:join_reference"
adapter = "pandas"
[cases.candidate]
target = "faults:join_bad"
adapter = "polars"
[[cases.invocation.args]]
kind = "frame"
[cases.invocation.args.schema]
min_rows = 1
max_rows = 12
[[cases.invocation.args.schema.columns]]
name = "customer_id"
dtype = "int64"
nullable = true
examples = [1, 2]
[cases.comparison]
row_order = "ignore"
dtype = "compatible"
[cases.generation]
max_examples = 100
seed = 101
[cases.performance]
enabled = false

[[cases]]
name = "integer-precision"
tags = ["integer", "precision"]
[cases.reference]
target = "faults:integer_precision_reference"
adapter = "pandas"
[cases.candidate]
target = "faults:integer_precision_bad"
adapter = "polars"
[[cases.invocation.args]]
kind = "frame"
[cases.invocation.args.schema]
min_rows = 1
max_rows = 4
[[cases.invocation.args.schema.columns]]
name = "quantity"
dtype = "int64"
nullable = false
minimum = 9007199254740992
maximum = 9007199254740995
examples = [9007199254740993]
[cases.comparison]
row_order = "strict"
dtype = "compatible"
rtol = 0
atol = 0
[cases.generation]
max_examples = 20
seed = 106
[cases.performance]
enabled = false

[[cases]]
name = "groupby-null"
tags = ["groupby", "null"]
[cases.reference]
target = "faults:groupby_reference"
adapter = "pandas"
[cases.candidate]
target = "faults:groupby_bad"
adapter = "polars"
[[cases.invocation.args]]
kind = "frame"
[cases.invocation.args.schema]
min_rows = 1
max_rows = 12
[[cases.invocation.args.schema.columns]]
name = "region"
dtype = "string"
nullable = true
categories = ["north", "south"]
[[cases.invocation.args.schema.columns]]
name = "amount"
dtype = "float64"
nullable = true
minimum = -100.0
maximum = 100.0
examples = [0.0, -0.0, 5.0]
[cases.comparison]
row_order = "ignore"
dtype = "compatible"
[cases.generation]
max_examples = 100
seed = 102
[cases.performance]
enabled = false

[[cases]]
name = "timezone-day"
tags = ["datetime", "timezone"]
[cases.reference]
target = "faults:timezone_reference"
adapter = "pandas"
[cases.candidate]
target = "faults:timezone_bad"
adapter = "polars"
[[cases.invocation.args]]
kind = "frame"
[cases.invocation.args.schema]
min_rows = 1
max_rows = 8
[[cases.invocation.args.schema.columns]]
name = "event_at"
dtype = "string"
nullable = false
categories = ["2026-01-01T01:30:00Z", "2026-06-01T03:30:00Z", "2026-06-01T18:00:00Z"]
[cases.comparison]
row_order = "strict"
dtype = "compatible"
[cases.generation]
max_examples = 60
seed = 103
[cases.performance]
enabled = false

[[cases]]
name = "dtype-width"
tags = ["dtype", "integer"]
