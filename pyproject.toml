[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "parity-check"
dynamic = ["version"]
description = "Local-first semantic verification for dataframe and numerical migrations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Leigh Shepperson" }]
keywords = ["dataframe", "pandas", "polars", "testing", "migration", "property-based-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "hypothesis>=6.130",
  "numpy>=1.26",
  "packaging>=24.0",
  "pandas>=2.1",
  "polars>=1.0",
  "psutil>=5.9.8",
  "pyarrow>=16",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.16.1",
]

[project.optional-dependencies]
workspace = [
  "tox>=4.44",
  "tox-uv>=1.29",
  "uv>=0.9.1",
]
test = [
  "pytest>=8.2",
  "pytest-cov>=5",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
parity = "parity.cli:app"

[project.entry-points.pytest11]
parity = "parity.pytest_plugin"

[project.urls]
Homepage = "https://github.com/leighshepperson/parity"
Repository = "https://github.com/leighshepperson/parity"
Issues = "https://github.com/leighshepperson/parity/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]

[tool.hatch.build.targets.sdist]
exclude = [
  "**/.parity*/**",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "case_studies/**/candidate-src/**",
  "case_studies/**/environments/**/src/**",
  "**/.coverage",
  "**/coverage.xml",
  "**/htmlcov/**",
  "**/.hypothesis/**",
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.venv/**",
]

[tool.hatch.version]
path = "src/parity/_version.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "integration: exercises subprocess or filesystem integration",
  "slow: runs an extended generated-case campaign",
]

[tool.coverage.run]
branch = true
source = ["parity"]

[tool.coverage.report]
# Ratchet this upward as the first-party suite grows.  The initial release is
# deliberately honest about its measured branch coverage instead of publishing
# an aspirational gate that no checkout can pass.
fail_under = 68
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["parity"]
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis.*", "psutil.*", "pyarrow.*", "polars.*"]
ignore_missing_imports = true
