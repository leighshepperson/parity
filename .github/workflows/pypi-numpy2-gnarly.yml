name: PyPI NumPy 2 gnarly migration

on:
  push:
    branches:
      - agent/numpy2-gnarly-upgrade

permissions:
  contents: read

jobs:
  gnarly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build NumPy migration harness
        shell: bash
        run: |
          cat > numpy2_harness.py <<'PY'
          import numpy as np
          import pandas as pd

          def stable_square(data: pd.DataFrame) -> pd.DataFrame:
              x = data["x"].astype("float64").to_numpy()
              return pd.DataFrame({"value": np.square(x)})

          def float32_python_scalar_promotion(data: pd.DataFrame) -> pd.DataFrame:
              a = np.float32(float(data["a"].iloc[0]))
              b = float(data["b"].iloc[0])
              result = a + b
              return pd.DataFrame({"value": [float(result)], "dtype": [str(np.asarray(result).dtype)]})

          def int8_large_python_scalar(data: pd.DataFrame) -> pd.DataFrame:
              a = np.int8(int(data["a"].iloc[0]))
              b = int(data["b"].iloc[0])
              result = a + b
              return pd.DataFrame({"value": [int(result)], "dtype": [str(np.asarray(result).dtype)]})

          def uint8_large_python_scalar(data: pd.DataFrame) -> pd.DataFrame:
              a = np.uint8(int(data["a"].iloc[0]))
              b = int(data["b"].iloc[0])
              result = a + b
              return pd.DataFrame({"value": [int(result)], "dtype": [str(np.asarray(result).dtype)]})

          def copy_false_from_list(data: pd.DataFrame) -> pd.DataFrame:
              values = data["x"].astype("float64").tolist()
              arr = np.array(values, dtype=np.float64, copy=False)
              return pd.DataFrame({"value": arr})

          def removed_float_alias(data: pd.DataFrame) -> pd.DataFrame:
              value = np.float_(float(data["x"].iloc[0]))
              return pd.DataFrame({"value": [float(value)]})

          def removed_complex_alias(data: pd.DataFrame) -> pd.DataFrame:
              value = np.complex_(complex(float(data["x"].iloc[0]), float(data["y"].iloc[0])))
              return pd.DataFrame({"real": [float(value.real)], "imag": [float(value.imag)]})

          def removed_cast_dict(data: pd.DataFrame) -> pd.DataFrame:
              arr = data["x"].astype("float64").to_numpy()
              out = np.cast[np.float32](arr)
              return pd.DataFrame({"value": out.astype("float64")})

          def ndarray_ptp_method(data: pd.DataFrame) -> pd.DataFrame:
              arr = data["x"].astype("float64").to_numpy()
              return pd.DataFrame({"value": [float(arr.ptp())]})

          def removed_product_alias(data: pd.DataFrame) -> pd.DataFrame:
              arr = data["x"].astype("float64").to_numpy()
              return pd.DataFrame({"value": [float(np.product(arr))]})
          PY

          mkdir -p numpy2-fixtures
          printf '%s\n' '[{"x":-2.0},{"x":0.0},{"x":3.0}]' > numpy2-fixtures/x.json
          printf '%s\n' '[{"x":1.0,"y":2.0}]' > numpy2-fixtures/xy.json
          printf '%s\n' '[{"a":3.0,"b":0.5}]' > numpy2-fixtures/float-promotion.json
          printf '%s\n' '[{"a":1,"b":200}]' > numpy2-fixtures/int8.json
          printf '%s\n' '[{"a":1,"b":300}]' > numpy2-fixtures/uint8.json

          cat > parity-numpy2.toml <<'TOML'
