      - name: Install published Parity and NumPy stacks
        shell: bash
        run: |
          python -m venv .venv-reference
          python -m venv .venv-candidate
          .venv-reference/bin/pip install 'parity-check==0.10.0' 'numpy==1.26.4' 'pandas==2.2.3'
          .venv-candidate/bin/pip install 'parity-check==0.10.0' 'numpy==2.0.2' 'pandas==2.2.3'
          .venv-reference/bin/python -c "import parity,numpy,pandas; print('REFERENCE', parity.__version__, numpy.__version__, pandas.__version__)"
          .venv-candidate/bin/python -c "import parity,numpy,pandas; print('CANDIDATE', parity.__version__, numpy.__version__, pandas.__version__)"

      - name: Run gnarly migration campaign
        id: campaign
        shell: bash
        run: |
          set +e
          .venv-candidate/bin/parity doctor --config parity-numpy2.toml
          doctor_status=$?
          .venv-candidate/bin/parity check --config parity-numpy2.toml --no-performance --json numpy2-report.json --markdown numpy2-report.md
          parity_status=$?
          set -e
          echo "doctor_status=$doctor_status" >> "$GITHUB_OUTPUT"
          echo "parity_status=$parity_status" >> "$GITHUB_OUTPUT"
          echo "DOCTOR_STATUS=$doctor_status PARITY_STATUS=$parity_status"

          .venv-candidate/bin/python - <<'PY'
          import collections, json
          report=json.load(open('numpy2-report.json'))
          print('REPORT_STATUS', report['status'])
          statuses=collections.Counter()
          signatures=collections.defaultdict(list)
          mismatch_kinds=collections.Counter()
          for c in report['cases']:
              statuses[c['status']] += 1
              print('CASE', c['name'], 'status=', c['status'], 'examples=', c.get('examples_run'), 'generated=', c.get('generated_examples'), 'findings=', c.get('findings_discovered'))
              for f in c.get('failures', []):
                  sig=f.get('finding_signature')
                  print('  source=', f.get('source'), 'mismatch=', f.get('mismatch_counts'), 'signature=', sig, 'artifact=', f.get('artifact'))
                  for kind,n in (f.get('mismatch_counts') or {}).items(): mismatch_kinds[kind]+=n
                  signatures[sig].append(c['name'])
          print('STATUS_COUNTS', dict(statuses))
          print('MISMATCH_KINDS', dict(mismatch_kinds))
          print('SIGNATURE_CLUSTERS')
          for sig,names in signatures.items(): print(' ', sig, '=>', names)
          print('COLLISIONS', {str(k):v for k,v in signatures.items() if len(v)>1})
          PY

      - name: Replay every artifact independently
        if: always()
        shell: bash
        run: |
          test -f numpy2-report.json || exit 0
          .venv-candidate/bin/python - <<'PY' > artifacts.tsv
          import json
          r=json.load(open('numpy2-report.json'))
          for c in r['cases']:
              for f in c.get('failures',[]):
                  if f.get('artifact'):
                      print(c['name']+'\t'+f['artifact'])
          PY
          while IFS=$'\t' read -r name artifact; do
            echo "REPLAY_CASE=$name ARTIFACT=$artifact"
            set +e
            .venv-candidate/bin/parity replay "$artifact"
            rc=$?
            set -e
            echo "REPLAY_RESULT case=$name rc=$rc"
          done < artifacts.tsv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-numpy2-gnarly
          path: |
            numpy2-report.json
            numpy2-report.md
            .parity-numpy2
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Only require harness integrity
        if: always()
        shell: bash
        run: |
          test "${{ steps.campaign.outputs.doctor_status }}" -eq 0
          test -f numpy2-report.json
