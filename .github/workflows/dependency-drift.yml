name: Dependency drift

on:
  schedule:
    # Stable one-axis checks run weekly; prereleases run once a month.
    - cron: "29 4 * * 3"
    - cron: "47 4 1 * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Dependency channel to exercise
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease
          - all

permissions:
  contents: read

concurrency:
  # Keep the weekly and monthly schedules independent when they happen to
  # land on the same Wednesday. Dispatch channels are likewise isolated.
  group: dependency-drift-${{ github.event_name }}-${{ github.event.schedule || inputs.channel || 'manual' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  stable:
    if: >-
      github.event.schedule == '29 4 * * 3' ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.channel == 'stable' || inputs.channel == 'all')
    name: Stable ${{ matrix.package }} axis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: [pandas, polars, pyarrow]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/minimum-py311.txt
      - run: python -m pip install --upgrade pip
      - name: Install the validated direct-dependency floor
        run: |
          python -m pip install --only-binary=:all: \
            --requirement .github/constraints/minimum-py311.txt
          python -m pip install --no-deps --editable .
      - name: Advance only the ${{ matrix.package }} axis
        env:
          DRIFT_PACKAGE: ${{ matrix.package }}
        run: |
          python -m pip install --only-binary=:all: --no-deps --upgrade "$DRIFT_PACKAGE"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          for package in ("numpy", "pandas", "polars", "pyarrow"):
              print(f"{package}=={version(package)}")
          PY
      - name: Run semantic tests only
        run: pytest -m "not slow" --ignore=tests/test_performance.py

  prerelease:
    if: >-
      github.event.schedule == '47 4 1 * *' ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.channel == 'prerelease' || inputs.channel == 'all')
    name: Prerelease ${{ matrix.package }} axis
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: [pandas, polars, pyarrow]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/minimum-py311.txt
      - run: python -m pip install --upgrade pip
      - name: Install the validated direct-dependency floor
        run: |
          python -m pip install --only-binary=:all: \
            --requirement .github/constraints/minimum-py311.txt
          python -m pip install --no-deps --editable .
      - name: Advance only the ${{ matrix.package }} axis to prereleases
        env:
          DRIFT_PACKAGE: ${{ matrix.package }}
        run: |
          python -m pip install --only-binary=:all: --no-deps --pre --upgrade "$DRIFT_PACKAGE"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          for package in ("numpy", "pandas", "polars", "pyarrow"):
              print(f"{package}=={version(package)}")
          PY
      - name: Run semantic tests only
        run: pytest -m "not slow" --ignore=tests/test_performance.py
