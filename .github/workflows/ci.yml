name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep the static-analysis interpreter aligned with mypy's minimum
          # supported-Python target.  NumPy releases for newer interpreters may
          # legitimately use syntax that cannot be parsed as Python 3.11.
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/parity
      - name: Seed excluded build evidence
        run: |
          mkdir -p case_studies/package-safety/.parity-package-sentinel
          printf 'must not ship\n' > case_studies/package-safety/.parity-package-sentinel/input.arrow
          mkdir -p case_studies/package-safety/environments/current/reference/src/upstream
          printf 'must not ship\n' > case_studies/package-safety/environments/current/reference/src/upstream/sentinel.txt
          mkdir -p case_studies/package-safety/candidate-src/upstream
          printf 'must not ship\n' > case_studies/package-safety/candidate-src/upstream/sentinel.txt
      - run: python -m build
      - name: Verify distributions contain no local evidence or caches
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          forbidden = (
              "/.parity",
              "/__pycache__/",
              "/.venv/",
              "/.hypothesis/",
              "/.mypy_cache/",
              "/.pytest_cache/",
              "/.ruff_cache/",
              "/.coverage",
              "/coverage.xml",
              "/htmlcov/",
              "/reference/src/",
              "/candidate/src/",
              "/candidate-src/",
              ".pyc",
          )
          archives = [*pathlib.Path("dist").glob("*.tar.gz"), *pathlib.Path("dist").glob("*.whl")]
          if len(archives) != 2:
              raise SystemExit(f"expected wheel and sdist, found: {archives}")
          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as bundle:
                      names = bundle.namelist()
              else:
                  with tarfile.open(archive, "r:gz") as bundle:
                      names = bundle.getnames()
              unsafe = [name for name in names if any(marker in f"/{name}" for marker in forbidden)]
              if unsafe:
                  raise SystemExit(f"unsafe packaged paths in {archive}: {unsafe}")
          PY

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      # Use the source path so pytest's installed Parity plugin cannot make the
      # package appear "imported before measurement" during plugin discovery.
      - run: pytest --cov=src/parity --cov-report=term-missing --cov-report=xml
      - name: Smoke-test generated project
        run: |
          temporary="$(mktemp -d)"
          cd "$temporary"
          parity init
          parity doctor
          parity check --no-performance --max-examples 20

  minimum-dependencies:
    name: Minimum dependencies (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/minimum-py311.txt
      - run: python -m pip install --upgrade pip
      - name: Install the validated direct-dependency floor
        run: |
          python -m pip install --only-binary=:all: \
            --requirement .github/constraints/minimum-py311.txt
          python -m pip install --no-deps --editable .
          python -m pip check
      - name: Smoke-test the managed-workspace tool floor
        env:
          PARITY_WORKSPACE_FLOOR_SMOKE: "1"
        run: |
          python -m pip install \
            tox==4.44.0 \
            tox-uv==1.29.0 \
            uv==0.9.1
          pytest tests/test_migration_workspace.py \
            -k generated_tox_config_runs_on_declared_tool_floor
      - name: Test without performance or extended campaigns
        run: pytest -m "not slow" --ignore=tests/test_performance.py

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Generate action fixture
        run: parity init action-smoke/parity.toml
      - name: Run local composite action
        uses: ./
        with:
          config: action-smoke/parity.toml
          max-examples: "20"
          max-findings: "2"
          stability-repeats: "2"
          performance: "false"
          artifact-name: parity-action-smoke
