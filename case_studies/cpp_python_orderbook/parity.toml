version = 2
artifact_dir = ".parity-orderbook"
jobs = 1

[case_defaults.reference]
workdir = "."

[case_defaults.candidate]
adapter = "arrow"
workdir = "."

[case_defaults.comparison]
rtol = 0.0
atol = 0.0
row_order = "strict"
dtype = "strict"

[case_defaults.generation]
stability_repeats = 2
seed = 20260822
derandomize = true
adversarial_examples = false
shrink = true
deadline_ms = 2000

[case_defaults.performance]
enabled = false

[[cases]]
name = "correct-port"
tags = ["control", "cpp", "python", "stateful"]
timeout_seconds = 15

[cases.reference]
command = ["parity", "adapter", "serve", "reference_adapter.py"]

[cases.candidate]
target = "candidate:correct_port"

[cases.generation]
generator = "generator:order_streams"
max_examples = 750
max_findings = 1

[cases.performance]
enabled = true
warmups = 2
repeats = 11
max_slowdown = 1.25
max_memory_ratio = 1.5
min_reference_ms = 0.0
fail_on_regression = false
confidence_level = 0.95
bootstrap_samples = 4000

[[cases]]
name = "naive-port"
tags = ["cpp", "expected-findings", "python", "stateful"]
timeout_seconds = 15

[cases.reference]
command = ["parity", "adapter", "serve", "reference_adapter.py"]

[cases.candidate]
target = "candidate:naive_port"

[cases.generation]
generator = "generator:order_streams"
max_examples = 500
max_findings = 6

[[cases]]
name = "regression-lot-size"
tags = ["cpp", "python", "regression"]
timeout_seconds = 15

[cases.reference]
command = ["parity", "adapter", "serve", "reference_adapter.py"]

[cases.candidate]
target = "candidate:correct_port"

[cases.generation]
generator = "generator:regression_lot_size"
max_examples = 1
max_findings = 1
stability_repeats = 3

