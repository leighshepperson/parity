[[units]]
id = "augment-rolling.cpu-builtins"
cases = ["rolling-control", "rolling-grouped-centered", "rolling-null-semantics"]

[[units]]
id = "augment-ewm.cpu-native"
cases = ["ewm-control", "ewm-grouped-unsorted", "ewm-null-semantics"]

[[units]]
id = "augment-macd.cpu-core"
cases = ["macd-control", "macd-grouped-unsorted", "macd-null-semantics"]

[[units]]
