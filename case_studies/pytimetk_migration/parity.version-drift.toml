version = 2
artifact_dir = ".parity-version-drift"
fail_fast = false

[[cases]]
name = "pandas-lags-drift"
tags = ["version-drift", "pandas", "augment-lags"]
timeout_seconds = 60
[[cases.invocation.args]]
kind = "frame"
fixture = "fixtures/augment_hostile.arrow"

[cases.reference]
target = "pytimetk_pilot:lags_null_pandas"
adapter = "pandas"
pandas_input = "native"
python = "environments/release/reference/.venv/bin/python"
record_distributions = ["pytimetk"]

[cases.candidate]
target = "pytimetk_pilot:lags_null_pandas"
adapter = "pandas"
pandas_input = "native"
python = "environments/current/reference/.venv/bin/python"
record_distributions = ["pytimetk"]

[cases.comparison]
row_order = "strict"
column_order = "strict"
dtype = "compatible"
null_nan_equal = true
rtol = 1e-9
atol = 1e-10

[cases.generation]
max_examples = 1
stability_repeats = 2
search = false
adversarial_examples = false
shrink = false

[cases.performance]
enabled = false

