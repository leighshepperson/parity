[[cases]]
name = "aggregate-numeric-control"
fixture = "fixtures/baseline_numeric.json"
tags = ["control", "low-level", "native", "matrix"]

[cases.reference]
target = "skrub_parity:pandas_aggregate_numeric"
adapter = "pandas"
pandas_input = "native"
record_distributions = ["skrub", "scikit-learn"]
environment = { SKB_DATA_DIRECTORY = "/tmp/parity-skrub-data", MPLCONFIGDIR = "/tmp/parity-mpl-cache" }

[cases.candidate]
target = "skrub_parity:polars_aggregate_numeric"
adapter = "polars"
record_distributions = ["skrub", "scikit-learn"]
environment = { SKB_DATA_DIRECTORY = "/tmp/parity-skrub-data", MPLCONFIGDIR = "/tmp/parity-mpl-cache" }

[cases.comparison]
row_order = "ignore"
column_order = "strict"
dtype = "compatible"

[cases.generation]
max_examples = 1
seed = 20260813
adversarial_examples = false
shrink = false
derandomize = true

[cases.performance]
enabled = false

